<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="100%" height="220" fill="none">
  <defs>
    <linearGradient id="ultraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#111622" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="35%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
    <pattern id="ultraGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
    <style>
      @keyframes sweepScan {
        0% { transform: translateX(0); }
        100% { transform: translateX(880px); }
      }
      @keyframes tonePulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      .sweep-line {
        animation: sweepScan 3.5s linear infinite;
      }
      .tone-carrier {
        animation: tonePulse 2s ease-in-out infinite;
      }
      .mono-code {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, monospace;
      }
    </style>
  </defs>

  <rect width="880" height="220" rx="12" fill="url(#ultraBg)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.2" />
  <rect width="880" height="220" rx="12" fill="url(#ultraGrid)" />

  <!-- Spectrum Frequency Markers -->
  <g transform="translate(40, 32)">
    <circle cx="5" cy="5" r="4" fill="#38bdf8" class="tone-carrier" />
    <text x="18" y="9" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1.5" class="mono-code">ACOUSTIC CARRIER · 17,000 HZ – 19,000 HZ (CP-FSK / MFSK)</text>
  </g>

  <!-- Frequency Grid Baseline -->
  <line x1="40" y1="150" x2="840" y2="150" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <line x1="40" y1="110" x2="840" y2="110" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3 3" />
  <line x1="40" y1="70" x2="840" y2="70" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3 3" />

  <!-- Acoustic Carrier Waves -->
  <path d="M 40 150 Q 90 90 140 150 T 240 150 T 340 150 T 440 90 T 540 150 T 640 150 T 740 70 T 840 150" fill="none" stroke="url(#waveGrad)" stroke-width="2.5" />
  
  <!-- Packet Burst Highlight -->
  <path d="M 420 150 C 430 70, 450 70, 460 150" fill="none" stroke="#e6b758" stroke-width="2.2" class="tone-carrier" />
  <text x="415" y="58" fill="#e6b758" font-size="10" font-weight="700" letter-spacing="1" class="mono-code">BARKER-13 SYNC</text>

  <!-- Real-Time Sweep Beam -->
  <g class="sweep-line">
    <line x1="0" y1="50" x2="0" y2="175" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8" />
  </g>

  <!-- Frequency Labels at Bottom -->
  <g transform="translate(40, 185)" fill="#64748b" font-size="11" font-weight="500" class="mono-code">
    <text x="0" y="0">17.0 kHz (Base)</text>
    <text x="200" y="0">17.5 kHz (Chirp)</text>
    <text x="400" y="0">18.0 kHz (Data 0)</text>
    <text x="600" y="0">18.5 kHz (Data 1)</text>
    <text x="750" y="0">19.0 kHz (Cutoff)</text>
  </g>
</svg>